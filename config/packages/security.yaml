security:
    # === HASHAGE DES MOTS DE PASSE ===
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # === FOURNISSEUR D'UTILISATEURS ===
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    # === FIREWALL PRINCIPAL ===
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        main:
            lazy: true
            provider: app_user_provider
            custom_authenticators:
                - App\Security\EmailOtpAuthenticator
            entry_point: App\Security\EmailOtpAuthenticator

            # --- Déconnexion ---
            logout:
                path: app_logout
                target: app_login             # ✅ redirection vers login après logout

            # --- Remember me ---
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 1209600             # 14 jours
                path: /
                always_remember_me: false

    # === RESTRICTION D'ACCÈS ===
    access_control:
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/logout, roles: PUBLIC_ACCESS }
        - { path: ^/forgot-password, roles: PUBLIC_ACCESS }
        - { path: ^/reset-password, roles: PUBLIC_ACCESS }
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/, roles: ROLE_USER }


when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
